<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighborhood History — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Public+Sans:wght@300..800&display=swap" rel="stylesheet">
<!--
  Preview only — not pasted anywhere. Loads sections/*.html in paste order into
  the wpp-base Section Builder wrappers, under the REAL theme stylesheets pulled
  live from vpm.org, so collisions show up here before they show up on staging.
  Needs network access to vpm.org and to be served over http (GitHub Pages, or
  `python3 -m http.server` from the repo root). Offline, the theme CSS silently
  fails to load and this degrades to an unstyled-host check only.
-->
<link rel="stylesheet" href="https://www.vpm.org/wp-content/themes/wpp-base/assets/css/base.css?ver=1.4.24" onload="this.dataset.ok=1" onerror="this.dataset.ok=0">
<link rel="stylesheet" href="https://www.vpm.org/wp-content/themes/wpp-base/assets/css/components.css?ver=1.4.24" onload="this.dataset.ok=1" onerror="this.dataset.ok=0">
<link rel="stylesheet" href="https://www.vpm.org/wp-content/themes/wpp-base/assets/css/overrides.css?ver=1.4.24" onload="this.dataset.ok=1" onerror="this.dataset.ok=0">
<link rel="stylesheet" href="https://www.vpm.org/wp-content/themes/wpp-base/assets/css/page-builder.css?ver=1.4.24" onload="this.dataset.ok=1" onerror="this.dataset.ok=0">
<style>
  /* Theme config vars, as the live page inlines them (#bsm-config-vars) */
  :root {
    --navy: #003865; --dark-navy: #101820; --blue: #6CACE4; --red: #c8102e;
    --yellow: #E0E721; --white: #ffffff; --gray-bg: #EDEDED; --light-blue: #e8f0f8;
    --gray-border: #e6e6e6; --gray-text-dark: #101820; --gray-text: #666666;
    --link-color: #1a7fc3;
    --font-primary: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
    --font-condensed: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
    --font-heading: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  }
  /* Preview-only chrome stand-ins (the real header/footer markup isn't reproduced) */
  .mock-bar { background: #003865; color: #fff; padding: 12px 16px; font: 600 13px Arial, sans-serif; }
  .mock-footer { background: #101820; color: #fff; padding: 48px 16px; }
  .preview-warn { position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; background: #c8102e;
    color: #fff; font: 600 13px/1.4 Arial, sans-serif; padding: 8px 16px; }
</style>
</head>
<body class="page-template page-template-templates page-template-section-builder page">
  <div class="mock-bar">Mock wpp-base header</div>
  <main id="bsm-main">
    <section class="page-section page-hero min-small align-left">
      <div class="page-hero-overlay navy"></div>
      <div class="container">
        <div class="page-hero-content">
          <h1>Neighborhood History</h1>
          <p class="page-hero-subtitle">Native theme hero — not part of this build.</p>
        </div>
      </div>
    </section>
    <div id="blocks"></div>
  </main>
  <footer class="mock-footer">Footer stand-in</footer>

<script>
(function () {
  var FILES = ['sections/01-timeline.html', 'sections/02-map.html', 'sections/03-closing.html'];
  var root = document.getElementById('blocks');

  /* Flag theme CSS that didn't load and images that 404 (e.g. a wrong srcset guess) */
  function warn(msg) {
    var bar = document.querySelector('.preview-warn');
    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'preview-warn';
      document.body.appendChild(bar);
    }
    bar.textContent += (bar.textContent ? ' · ' : '') + msg;
  }

  function checkAssets() {
    var links = document.querySelectorAll('link[href*="wpp-base"]');
    var loaded = [].filter.call(links, function (l) { return l.dataset.ok === '1'; });
    if (loaded.length < links.length) { warn('Theme CSS not loaded (' + loaded.length + '/' + links.length + ') — results are not representative'); }

    document.querySelectorAll('.vpm-nh img').forEach(function (img) {
      img.loading = 'eager';
      function check() {
        if (!img.naturalWidth) { warn('Image failed: ' + (img.currentSrc || img.src).split('/').pop()); }
      }
      if (img.complete) { check(); } else { img.addEventListener('load', check); img.addEventListener('error', check); }
    });
  }

  function mount(html) {
    var section = document.createElement('section');
    section.className = 'page-section page-code-block';
    section.innerHTML = '<div class="container"><div class="page-code-block-html"></div></div>';
    var slot = section.querySelector('.page-code-block-html');
    slot.innerHTML = html;
    /* innerHTML doesn't run scripts; recreate them so fragment JS executes */
    slot.querySelectorAll('script').forEach(function (old) {
      var s = document.createElement('script');
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    root.appendChild(section);
  }

  FILES.reduce(function (chain, file) {
    return chain.then(function () {
      return fetch(file).then(function (r) {
        if (!r.ok) { throw new Error(file + ': ' + r.status); }
        return r.text();
      }).then(mount);
    });
  }, Promise.resolve()).then(checkAssets).catch(function (err) {
    root.textContent = 'Preview failed to load fragments — serve over http. ' + err.message;
  });
})();
</script>
</body>
</html>
